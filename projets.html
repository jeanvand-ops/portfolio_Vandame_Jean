<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projets – Jean Vandame</title>
<meta name="description" content="Les projets de Jean Vandame : motion design, illustration, 3D et print.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Poppins:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#000;
  --rouge:#ff0a14;
  --papier:#f2efea;
  --jaune:#ffe79a;
  --accent:#ff0a14;
  --barre:58px;
  --titre:'Anton',Impact,'Arial Narrow',sans-serif;
  --nom:'Archivo Black','Arial Black',sans-serif;
  --texte:'Poppins','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--noir);color:var(--papier);font-family:var(--texte);line-height:1.55;overflow-x:hidden;min-height:100svh}
a{color:inherit}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--jaune);outline-offset:3px}

.grain{position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.17;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* barre rouge (identique à l'accueil) */
.barre{position:fixed;top:0;left:0;right:0;height:var(--barre);z-index:80;background:var(--rouge);color:var(--noir);
  display:flex;align-items:stretch;justify-content:space-between;font-family:var(--nom);text-transform:uppercase;font-size:.92rem;letter-spacing:.02em}
.barre .logo{display:flex;align-items:center;gap:.6rem;padding:0 1.2rem;text-decoration:none;font-family:var(--titre);font-size:1.6rem}
.barre .logo .court{display:none}
.barre .logo svg{width:1.1rem;height:1.1rem;fill:currentColor;transition:transform .5s}
.barre .logo:hover svg{transform:rotate(90deg)}
.barre nav{display:flex}
.barre nav a{white-space:nowrap;display:flex;align-items:center;padding:0 1.3rem;text-decoration:none;border-left:2px solid var(--noir);transition:background .12s,color .12s}
.barre nav a:hover,.barre nav a[aria-current]{background:var(--noir);color:var(--rouge)}

/* ---------- ÉCRAN DE SÉLECTION ---------- */
.ecran{min-height:100svh;padding:calc(var(--barre) + 1.6rem) clamp(1.2rem,4vw,3rem) 1.4rem;display:grid;grid-template-rows:auto 1fr auto;gap:1.4rem;
  background:radial-gradient(ellipse 70% 60% at 30% 55%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 70%),var(--noir);
  transition:background .4s}
.entete{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.entete h1{font-family:var(--titre);font-weight:400;text-transform:uppercase;font-size:clamp(2.6rem,6vw,5rem);line-height:.9}
.entete p{font-size:.88rem;opacity:.75}
.entete kbd{font-family:var(--nom);font-size:.75rem;border:2px solid currentColor;padding:0 .35rem;margin:0 .15rem}

.scene{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(1.4rem,4vw,4rem);align-items:center;max-width:1300px;width:100%;margin:0 auto}

/* le perso */
.perso{position:relative;aspect-ratio:1;width:min(100%,62vh);justify-self:end;background:var(--accent);box-shadow:14px 14px 0 var(--papier);overflow:hidden;cursor:pointer}
.perso img{width:100%;height:100%;object-fit:cover}
.perso .flash{position:absolute;inset:0;background:var(--papier);opacity:0;pointer-events:none}
.perso.change .flash{animation:flash .35s ease-out}
.perso.change img{animation:entre .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@keyframes entre{0%{transform:scale(.85) translateY(6%)}100%{transform:none}}
/* sans GIF : petit sautillement provisoire au survol */
.perso.anim img,.vignette.anim img{animation:sautille .5s ease-in-out infinite alternate}
@keyframes sautille{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-3%) rotate(-1.5deg)}}
.perso .badge{position:absolute;top:.9rem;left:.9rem;background:var(--noir);color:var(--papier);font-family:var(--nom);font-size:.75rem;padding:.25rem .55rem;text-transform:uppercase}

/* la fiche */
.fiche{max-width:560px}
.fiche .num{font-family:var(--nom);font-size:.9rem;color:var(--accent);filter:brightness(1.25)}
.fiche h2{font-family:var(--titre);font-weight:400;text-transform:uppercase;line-height:.86;font-size:clamp(3.6rem,9vw,8.5rem);margin:.2rem 0 .9rem;overflow-wrap:anywhere}
.fiche .role{font-family:var(--nom);text-transform:uppercase;font-size:.85rem;margin-bottom:.8rem}
.fiche .desc{max-width:42ch;margin-bottom:1.4rem}
.stats{display:grid;gap:.6rem;margin-bottom:1.8rem}
.stat{display:grid;grid-template-columns:6.5rem 1fr;align-items:center;gap:.8rem;font-family:var(--nom);font-size:.78rem;text-transform:uppercase}
.jauge{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;height:14px}
.jauge i{background:rgba(242,239,234,.15);transform-origin:left}
.jauge i.on{background:var(--papier);animation:remplit .3s both}
@keyframes remplit{from{transform:scaleX(0)}}
.bouton{display:inline-flex;align-items:center;gap:.7rem;background:var(--rouge);color:var(--noir);font-family:var(--nom);text-transform:uppercase;
  padding:.9rem 1.4rem;font-size:.95rem;transition:transform .15s,box-shadow .15s}
.bouton svg{width:1rem;height:1rem;fill:currentColor}
.bouton:hover{transform:translate(-4px,-4px);box-shadow:5px 5px 0 var(--papier)}

/* la rangée de vignettes */
.rangee{display:flex;gap:.7rem;overflow-x:auto;padding:1rem .2rem .6rem;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--rouge) transparent;justify-content:safe center}
.vignette{position:relative;flex:0 0 auto;width:clamp(64px,7.5vw,96px);aspect-ratio:1;scroll-snap-align:center;background:#222;transition:transform .15s}
.vignette img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.6);transition:filter .15s}
.vignette:hover img,.vignette[aria-current="true"] img{filter:none}
.vignette:hover{transform:translateY(-4px)}
.vignette[aria-current="true"]{outline:4px solid var(--rouge);outline-offset:3px;transform:translateY(-6px)}
.vignette[aria-current="true"]::before{content:"";position:absolute;left:50%;top:-1.1rem;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--rouge)}
.vignette.vide{background:var(--jaune);display:grid;place-items:center}
.vignette.vide svg,.perso.vide svg{width:45%;fill:var(--rouge)}
.perso.vide{display:grid;place-items:center;background:var(--jaune)}
.perso.vide svg{width:40%}

/* ---------- FENÊTRE PROJET ---------- */
dialog{border:0;padding:0;background:transparent;color:var(--papier);max-width:none;max-height:none;width:100%;height:100%}
dialog::backdrop{background:rgba(0,0,0,.92)}
.fenetre{min-height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:2rem;align-items:center;padding:clamp(1rem,4vw,3rem)}
.fenetre img{width:100%;max-height:86vh;object-fit:contain}
.fenetre h2{font-family:var(--titre);font-weight:400;text-transform:uppercase;font-size:clamp(3rem,7vw,6.5rem);line-height:.86;margin-bottom:1rem}
.fenetre .role{font-family:var(--nom);text-transform:uppercase;font-size:.85rem;margin-bottom:.8rem;color:var(--rouge)}
.fermer{position:fixed;top:1rem;right:1rem;background:var(--rouge);color:var(--noir);font-family:var(--nom);text-transform:uppercase;padding:.6rem 1rem;font-size:.85rem}
.fenetre .vide{aspect-ratio:16/9;background:var(--jaune);display:grid;place-items:center;color:var(--noir);font-family:var(--nom)}

@media (max-width:860px){
  .barre nav a{padding:0 .8rem;font-size:.78rem}
  .barre .logo{font-size:1.3rem;padding:0 .9rem}
  .barre .logo .long{display:none}.barre .logo .court{display:inline}
  .scene{grid-template-columns:1fr}
  .perso{justify-self:center;width:min(100%,46vh)}
  .fenetre{grid-template-columns:1fr}
  .rangee{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  .grain{animation:none}
  .perso.change .flash,.perso.change img,.perso.anim img,.vignette.anim img,.jauge i.on{animation:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="etoile" viewBox="0 0 100 100"><path d="M50 0C54 30 70 46 100 50C70 54 54 70 50 100C46 70 30 54 0 50C30 46 46 30 50 0Z"/></symbol>
  <symbol id="fleche" viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></symbol>
</svg>
<div class="grain" aria-hidden="true"></div>

<header class="barre">
  <a class="logo" href="index.html" aria-label="Jean Vandame, accueil"><svg><use href="#etoile"/></svg><span class="long">Jean Vandame</span><span class="court">JV</span></a>
  <nav aria-label="Menu principal">
    <a href="projets.html" aria-current="page">Projets</a>
    <a href="index.html#apropos">À propos</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<main class="ecran">
  <div class="entete">
    <h1>Choisis ton projet</h1>
    <p>Flèches <kbd>←</kbd><kbd>→</kbd> pour changer, <kbd>Entrée</kbd> pour ouvrir</p>
  </div>

  <div class="scene">
    <button class="perso" id="perso" aria-label="Ouvrir le projet">
      <img id="perso-img" alt="">
      <span class="badge" id="badge"></span>
      <span class="flash"></span>
    </button>
    <div class="fiche" aria-live="polite">
      <div class="num" id="num"></div>
      <h2 id="nom"></h2>
      <div class="role" id="role"></div>
      <p class="desc" id="desc"></p>
      <div class="stats" id="stats"></div>
      <button class="bouton" id="ouvrir">Voir le projet <svg><use href="#fleche"/></svg></button>
    </div>
  </div>

  <div class="rangee" id="rangee" role="tablist" aria-label="Projets"></div>
</main>

<dialog id="fenetre" aria-labelledby="f-nom">
  <div class="fenetre">
    <div id="f-media"></div>
    <div>
      <div class="role" id="f-role"></div>
      <h2 id="f-nom"></h2>
      <p id="f-desc"></p>
    </div>
  </div>
  <button class="fermer" id="fermer">Fermer ✕</button>
</dialog>

<script>
/* =====================================================================
   TES PROJETS : c'est ici que tu modifies tout.
   - id      : nom des fichiers. Le site cherche :
                 perso-ID.jpg  → image fixe du personnage (1:1)
                 perso-ID.gif  → animation du personnage (1:1), jouée au survol
                 img-ID.jpg    → visuel du projet, affiché dans la fenêtre
   - couleur : couleur de fond derrière le personnage
   - stats   : de 0 à 10, libellés libres
   - video   : (facultatif) lien YouTube/Vimeo en mode « embed »
   ===================================================================== */
const PROJETS = [
  { id:'meduse', nom:'Méduse', role:'Animation · Direction artistique', couleur:'#ff0a14',
    desc:"Persée tranche la tête de Méduse. Deux couleurs, du grain, 1 min 20 d'animation.",
    stats:{ Grain:9, Tension:9, Couleur:3 } },
  { id:'monsieur', nom:'Monsieur', role:'Illustration', couleur:'#b3001b',
    desc:"Une silhouette, trois couleurs, des angles vifs. Il pleure, et on ne sait pas pourquoi.",
    stats:{ Grain:4, Tension:8, Couleur:4 } },
  { id:'play4life', nom:'Play 4 Life', role:'Motion design · TF1', couleur:'#ffe79a',
    desc:"Direction artistique et motion design pour TF1.",
    stats:{ Grain:5, Tension:6, Couleur:8 } },
  { id:'carton-tv', nom:'Carton TV', role:'Illustration', couleur:'#8a1c14',
    desc:"Un vieux monsieur, sa télé, ses écrans. Tout en carton découpé.",
    stats:{ Grain:6, Tension:3, Couleur:7 } },
  { id:'carton-foot', nom:'Carton Foot', role:'Illustration', couleur:'#1d6b2f',
    desc:"France 1987, le penalty. Le même univers carton, côté terrain.",
    stats:{ Grain:6, Tension:6, Couleur:8 } },
  { id:'toid', nom:'TOID', role:'Affiche · Illustration', couleur:'#ff3b3b',
    desc:"Une silhouette en manteau rouge, une typo géante qui écrase le décor.",
    stats:{ Grain:7, Tension:8, Couleur:4 } },
  { id:'qualbo', nom:'Qualbo', role:'Affiche · RATP', couleur:'#2bbfa0',
    desc:"Les 30 ans des Musiciens du Métro. Des instruments qui débordent de partout.",
    stats:{ Grain:8, Tension:4, Couleur:10 } },
  { id:'uma', nom:'UMÀ', role:'Affiche DOOH', couleur:'#c10010',
    desc:"Heureux mais jamais lourd. Une campagne rouge et rose pour une boisson sans alcool.",
    stats:{ Grain:3, Tension:5, Couleur:5 } },
  { id:'aquarium', nom:'Aquarium', role:'Print', couleur:'#2340ff',
    desc:"Un faux ticket d'entrée, détourné pour Sea Shepherd. Tout ici est temporaire.",
    stats:{ Grain:8, Tension:7, Couleur:2 } },
  { id:'qonto', nom:'Qonto', role:'Motion design · Titrage', couleur:'#ffe79a',
    desc:"L'heure de la relève : titrage d'une série vidéo pour Qonto.",
    stats:{ Grain:5, Tension:4, Couleur:5 } },
  { id:'bose', nom:'Bose', role:'3D · Blender', couleur:'#1b2a55',
    desc:"Un casque, une lumière, un fond bleu nuit. Rendu produit en 3D.",
    stats:{ Grain:2, Tension:3, Couleur:3 } },
  { id:'scrap', nom:'SCRAP', role:'Identité visuelle', couleur:'#f2efea',
    desc:"Un mot, un point rouge, une grille. L'identité la plus simple possible.",
    stats:{ Grain:1, Tension:3, Couleur:1 } },
];

/* ---------------- ne rien changer en dessous ---------------- */
const $ = id => document.getElementById(id);
const AUCUNE_IMAGE = new Set(['play4life']); // projets sans visuel pour l'instant
const gifs = {};                              // gifs trouvés dans le dépôt
let actuel = 0;

// vérifie quels GIF existent (perso-ID.gif)
PROJETS.forEach(p => { const g = new Image(); g.onload = () => gifs[p.id] = g.src; g.src = `perso-${p.id}.gif`; });

// vignettes
const rangee = $('rangee');
PROJETS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'vignette' + (AUCUNE_IMAGE.has(p.id) ? ' vide' : '');
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-label', p.nom);
  b.innerHTML = AUCUNE_IMAGE.has(p.id) ? '<svg aria-hidden="true"><use href="#etoile"/></svg>' : `<img src="perso-${p.id}.jpg" alt="">`;
  b.addEventListener('click', () => choisir(i));
  b.addEventListener('mouseenter', () => animer(b, p, true));
  b.addEventListener('mouseleave', () => animer(b, p, false));
  b.addEventListener('dblclick', ouvrir);
  rangee.appendChild(b);
});

function animer(el, p, on) {
  const img = el.querySelector('img');
  if (!img) return;
  if (gifs[p.id]) img.src = on ? gifs[p.id] : `perso-${p.id}.jpg`;
  else el.classList.toggle('anim', on);
}

function choisir(i) {
  actuel = (i + PROJETS.length) % PROJETS.length;
  const p = PROJETS[actuel];
  document.documentElement.style.setProperty('--accent', p.couleur);

  const perso = $('perso'), img = $('perso-img');
  const vide = AUCUNE_IMAGE.has(p.id);
  perso.classList.toggle('vide', vide);
  perso.querySelector('svg')?.remove();
  if (vide) { img.hidden = true; perso.insertAdjacentHTML('afterbegin', '<svg aria-hidden="true"><use href="#etoile"/></svg>'); }
  else { img.hidden = false; img.src = `perso-${p.id}.jpg`; }
  $('badge').textContent = gifs[p.id] ? 'Survole-moi' : 'Perso à venir';
  perso.classList.remove('change'); void perso.offsetWidth; perso.classList.add('change');

  $('num').textContent = String(actuel + 1).padStart(2, '0') + ' / ' + String(PROJETS.length).padStart(2, '0');
  $('nom').textContent = p.nom;
  $('role').textContent = p.role;
  $('desc').textContent = p.desc;
  $('stats').innerHTML = Object.entries(p.stats).map(([k, v]) =>
    `<div class="stat"><span>${k}</span><div class="jauge" role="img" aria-label="${k} ${v} sur 10">${
      Array.from({length:10}, (_, j) => `<i class="${j < v ? 'on' : ''}" style="animation-delay:${j * 35}ms"></i>`).join('')
    }</div></div>`).join('');

  [...rangee.children].forEach((v, j) => v.setAttribute('aria-current', j === actuel));
  const v = rangee.children[actuel];
  rangee.scrollTo({left: v.offsetLeft - rangee.clientWidth / 2 + v.clientWidth / 2, behavior:'smooth'});
  history.replaceState(null, '', '#' + p.id);
}

// survol du grand perso
$('perso').addEventListener('mouseenter', () => animer($('perso'), PROJETS[actuel], true));
$('perso').addEventListener('mouseleave', () => animer($('perso'), PROJETS[actuel], false));

// fenêtre projet
function ouvrir() {
  const p = PROJETS[actuel];
  $('f-nom').textContent = p.nom;
  $('f-role').textContent = p.role;
  $('f-desc').textContent = p.desc;
  $('f-media').innerHTML = p.video
    ? `<iframe src="${p.video}" style="width:100%;aspect-ratio:16/9;border:0" allow="autoplay; fullscreen" allowfullscreen title="${p.nom}"></iframe>`
    : AUCUNE_IMAGE.has(p.id) ? '<div class="vide">Visuel à venir</div>'
    : `<img src="img-${p.id}.jpg" alt="${p.nom}">`;
  $('fenetre').showModal();
}
$('perso').addEventListener('click', ouvrir);
$('ouvrir').addEventListener('click', ouvrir);
$('fermer').addEventListener('click', () => $('fenetre').close());
$('fenetre').addEventListener('click', e => { if (e.target.closest('.fenetre') && !e.target.closest('img,iframe,h2,p,.role')) $('fenetre').close(); });

// clavier
addEventListener('keydown', e => {
  if ($('fenetre').open) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); choisir(actuel + 1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); choisir(actuel - 1); }
  if (e.key === 'Enter' && document.activeElement === document.body) ouvrir();
});

// projet demandé dans l'adresse (ex. projets.html#meduse)
const depart = PROJETS.findIndex(p => p.id === location.hash.slice(1));
choisir(depart >= 0 ? depart : 0);
</script>
</body>
</html>
