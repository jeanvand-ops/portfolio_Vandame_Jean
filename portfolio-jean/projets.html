<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projets – Jean Vandame</title>
<meta name="description" content="Les projets de Jean Vandame : motion design, illustration, 3D et print.">
<meta property="og:title" content="Projets – Jean Vandame">
<meta name="theme-color" content="#ff0a14">
<link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/selection.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="etoile" viewBox="0 0 100 100"><path d="M50 0C54 30 70 46 100 50C70 54 54 70 50 100C46 70 30 54 0 50C30 46 46 30 50 0Z"/></symbol>
  <symbol id="fleche" viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></symbol>
</svg>
<div class="grain" aria-hidden="true"></div>
<header class="barre">
  <a class="logo" href="index.html" aria-label="Jean Vandame, accueil"><picture><source media="(max-width:760px)" srcset="logo/logo-marque.svg"><img src="logo/logo-barre.svg" alt="Jean Vandame"></picture></a>
  <nav aria-label="Menu principal">
    <a href="projets.html" aria-current="page">Projets</a>
    <a href="index.html#apropos">À propos</a>
    <a href="index.html#contact">Contact</a>
    
  </nav>
</header>
<main class="ecran">
  <div class="entete">
    <h1>Choisis ton projet</h1>
    <p>Flèches <kbd>←</kbd><kbd>→</kbd> pour changer, <kbd>Entrée</kbd> pour ouvrir</p>
  </div>

  <div class="scene">
    <button class="perso" id="perso" aria-label="Ouvrir le projet">
      <img id="perso-img" alt="">
      <span class="badge" id="badge"></span>
      <span class="flash"></span>
    </button>
    <div class="fiche" aria-live="polite">
      <div class="num" id="num"></div>
      <h2 id="nom"></h2>
      <div class="role" id="role"></div>
      <p class="desc" id="desc"></p>
      <div class="stats" id="stats"></div>
      <button class="bouton" id="ouvrir">Voir le projet <svg><use href="#fleche"/></svg></button>
    </div>
  </div>

  <div class="rangee" id="rangee" role="tablist" aria-label="Projets"></div>
</main>
<script src="js/projets-data.js"></script>
<script src="js/selection.js"></script>
</body>
</html>
